<!doctype html>
<html lang="en-AU" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="antinode-brand" content="{{BRAND_VERSION}}">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="dark">
<title>antinode</title>
<meta name="description" content="Focused on the patient. Guided by the science. To find out more, get in touch.">
<link rel="canonical" href="{{SITE_URL}}/">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<meta property="og:type" content="website">
<meta property="og:site_name" content="antinode">
<meta property="og:title" content="antinode">
<meta property="og:description" content="Focused on the patient. Guided by the science. To find out more, get in touch.">
<meta property="og:url" content="{{SITE_URL}}/">
<meta property="og:image" content="{{SITE_URL}}/assets/img/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:image:alt" content="The antinode logo">
<meta property="og:locale" content="en_AU">
<meta name="twitter:card" content="summary">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "antinode",
  "legalName": "Antinode Pty Ltd",
  "url": "{{SITE_URL}}/",
  "logo": "{{SITE_URL}}/assets/img/icon-512.png",
  "description": "Focused on the patient. Guided by the science."
}
</script>

<link rel="preload" href="/assets/brand/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/brand/antinode.css">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <a href="/" class="home" aria-label="antinode home"><span class="logo" data-antinode-logo="lockup"></span></a>
  </div>
</header>

<main id="main" class="wrap">
  <section class="intro" aria-labelledby="motto">
    <h1 id="motto"><span>Focused on the patient.</span> <span>Guided by the science.</span></h1>
    <p class="lede">To find out more, get in touch.</p>
    <figure class="wave" aria-hidden="true">
      <svg viewBox="0 0 1200 220" preserveAspectRatio="none" data-wave></svg>
    </figure>
  </section>

  <section class="contact" id="contact" aria-label="Contact">
    <form class="contact-form" action="{{CONTACT_FORM_ENDPOINT}}" method="POST" data-contact-form>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required maxlength="120">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="200">
      </div>
      <div class="field full">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required maxlength="5000"></textarea>
      </div>
      <!-- Spam trap: people never see or fill this field. -->
      <div class="trap" aria-hidden="true">
        <label for="hp-field">Leave this empty</label>
        <input id="hp-field" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
      </div>
      <input type="hidden" name="_subject" value="antinode.bio enquiry">
      <div class="field full submit-row">
        <button class="btn" type="submit">Send message</button>
        <p class="meta privacy">We use these details only to reply to you.</p>
      </div>
      <p class="form-status" role="status" aria-live="polite" data-form-status></p>
    </form>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© {{YEAR}} Antinode Pty Ltd</span>
    <span>antinode.bio</span>
  </div>
</footer>

<script src="/assets/brand/antinode.js"></script>
<script src="/assets/site.js"></script>
</body>
</html>
